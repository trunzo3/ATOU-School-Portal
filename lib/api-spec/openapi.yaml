        locked: { type: number }
      required: [totalSchools, complete, partial, untouched, locked]
    QuestionState:
      type: object
      properties:
        questionKey: { type: string }
        answered: { type: boolean }
        # Answered, but the value conflicts with the calculated workshop
        # schedule (only ever true for workshop_time). Distinct from
        # unanswered: the school provided a time, but it doesn't work.
        conflict: { type: boolean }
        # Answered, but part of it is still missing (only ever true for
        # teachers: a saved list where a teacher has no student count).
        # Counts as outstanding for complete/partial purposes.
        incomplete: { type: boolean }
        summary: { type: ["string", "null"] }
      required: [questionKey, answered, conflict, incomplete, summary]
    SchoolRow:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        code: { type: string }
        link: { type: string }
        workshopDate: { type: ["string", "null"] }
        locked: { type: boolean }
        approxStudents: { type: ["string", "null"] }
        questionStates:
          type: array
          items:
            $ref: "#/components/schemas/QuestionState"
        missingCount: { type: number }
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        sendStatus: { type: string, enum: [never_sent, sent_waiting, answered] }
        lastSentAt: { type: ["string", "null"] }
        # Date the logistics email is due to go out (60 days before the
        # workshop); null once sent or when the due date has passed.
        pendingSendDate: { type: ["string", "null"] }
