    SendEmailsInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SendEmailsItem"
        subject: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
