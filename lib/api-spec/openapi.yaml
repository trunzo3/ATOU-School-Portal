openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATOU workshop logistics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: portal
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /portal/{code}/identify:
    post:
      operationId: identifyPortalUser
      tags: [portal]
      summary: Verify an email against a school's authorized contacts
      parameters:
        - $ref: "#/components/parameters/PortalCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalIdentity"
      responses:
        "200":
          description: Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "403":
          description: Email not authorized for this school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Unknown school link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /portal/{code}/answers/fetch:
    post:
      operationId: fetchPortalAnswers
      tags: [portal]
      summary: All answers with full history for a school
      parameters:
        - $ref: "#/components/parameters/PortalCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalIdentity"
      responses:
        "200":
          description: Answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolAnswers"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /portal/{code}/answers/{questionKey}:
    put:
      operationId: saveAnswer
      tags: [portal]
      summary: Save a new value for a question (every save is kept in history)
      parameters:
        - $ref: "#/components/parameters/PortalCode"
        - name: questionKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerVersion"
        "403":
          description: Not authorized or school locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /portal/{code}/teachers:
    put:
      operationId: saveTeachers
      tags: [portal]
      summary: Save the full teacher list as a new snapshot
      parameters:
        - $ref: "#/components/parameters/PortalCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeachersInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeachersSnapshot"
        "403":
          description: Not authorized or school locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /portal/{code}/pages:
    get:
      operationId: getPortalPages
      tags: [portal]
      summary: Published info pages for schools
      parameters:
        - $ref: "#/components/parameters/PortalCode"
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InfoPage"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin sign in (sets session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/forgot-password:
    post:
      operationId: adminForgotPassword
      tags: [admin]
      summary: Request a password reset email (never reveals whether the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Neutral acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"
        "429":
          description: Too many reset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Email sending is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"
  /admin/reset-password:
    post:
      operationId: adminResetPassword
      tags: [admin]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/dev-login:
    post:
      operationId: adminDevLogin
      tags: [admin]
      summary: Temporary development-only login as Pam
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current signed-in admin
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Dashboard totals
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/summary-report:
    get:
      operationId: getSummaryReport
      tags: [admin]
      summary: The full weekly-summary report for the admin summary page
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryReport"
  /admin/automation:
    get:
      operationId: getAutomationSettings
      tags: [admin]
      summary: Automatic email settings (logistics requests + weekly summary)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
  /admin/automation/logistics:
    put:
      operationId: updateAutoLogistics
      tags: [admin]
      summary: Update the automatic logistics request settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoLogisticsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/automation/weekly:
    put:
      operationId: updateWeeklySummary
      tags: [admin]
      summary: Update the weekly summary email settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklySummaryInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/automation/weekly/send-now:
    post:
      operationId: sendWeeklySummaryNow
      tags: [admin]
      summary: Send the weekly summary email to the saved recipients right now
      responses:
        "200":
          description: Sent; settings with the new last-sent time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
        "400":
          description: No recipients saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Resend is not configured or rejected the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/schools:
    get:
      operationId: getAdminSchools
      tags: [admin]
      summary: All schools with per-question answer state for the grid
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolRow"
  /admin/schools/{id}:
    get:
      operationId: getAdminSchool
      tags: [admin]
      summary: One school with contacts and link
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/schools/{id}/lock:
    patch:
      operationId: setSchoolLock
      tags: [admin]
      summary: Lock or unlock editing for a school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolLockUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDetail"
  /admin/schools/{id}/auto-send:
    patch:
      operationId: setAutoSendSkip
      tags: [admin]
      summary: Skip or restore a school's automatic logistics email
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoSendSkipInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDetail"
  /admin/email-status:
    get:
      operationId: getEmailStatus
      tags: [admin]
      summary: Resend connection and live email delivery status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatus"
  /admin/email-settings:
    put:
      operationId: updateEmailSettings
      tags: [admin]
      summary: Turn live school email delivery on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsInput"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatus"
        "400":
          description: Invalid setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/email/test:
    post:
      operationId: sendTestEmail
      tags: [admin]
      summary: Send one Resend test email without changing live delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: Test email accepted by Resend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResult"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Resend is not configured or rejected the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/sends:
    get:
      operationId: getEmailSends
      tags: [admin]
      summary: Sent log, newest first
      responses:
        "200":
          description: Sends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailSendRecord"
  /admin/send:
    post:
      operationId: sendEmails
      tags: [admin]
      summary: Send the logistics email to the selected schools and log it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailsInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailsResult"
  /admin/templates:
    get:
      operationId: getEmailTemplates
      tags: [admin]
      summary: Named email templates for the compose picker
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"
  /admin/templates/{id}:
    put:
      operationId: updateEmailTemplate
      tags: [admin]
      summary: Save new subject and body for one template
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/admins:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List admin accounts
      responses:
        "200":
          description: Admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Add an admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/admins/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Set an admin's password
      parameters:
        - $ref: "#/components/parameters/AdminId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Remove an admin account
      parameters:
        - $ref: "#/components/parameters/AdminId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Cannot remove the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/pages:
    get:
      operationId: getAdminPages
      tags: [admin]
      summary: All info pages (published and not)
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InfoPage"
    post:
      operationId: createPage
      tags: [admin]
      summary: Create an info page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfoPageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoPage"
  /admin/pages/{id}:
    patch:
      operationId: updatePage
      tags: [admin]
      summary: Update an info page
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfoPageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoPage"
    delete:
      operationId: deletePage
      tags: [admin]
      summary: Delete an info page
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/pages/export:
    get:
      operationId: exportPages
      tags: [admin]
      summary: Export all info pages
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagesExport"
  /admin/videos:
    get:
      operationId: getLearningLabVideos
      tags: [admin]
      summary: All Learning Lab walkthrough videos, newest publication first
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningLabVideo"
    post:
      operationId: createLearningLabVideo
      tags: [admin]
      summary: Add a Learning Lab video (YouTube or Vimeo link only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningLabVideoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningLabVideo"
        "400":
          description: Invalid input (e.g. not a YouTube/Vimeo link)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/videos/{id}:
    patch:
      operationId: updateLearningLabVideo
      tags: [admin]
      summary: Update a Learning Lab video
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningLabVideoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningLabVideo"
        "400":
          description: Invalid update (e.g. not a YouTube/Vimeo link)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteLearningLabVideo
      tags: [admin]
      summary: Delete a Learning Lab video
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/airtable/status:
    get:
      operationId: getAirtableStatus
      tags: [admin]
      summary: Airtable connection and sync status (auth via the Replit connection)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableStatus"
  /admin/airtable/sync:
    post:
      operationId: syncAirtableNow
      tags: [admin]
      summary: Run an Airtable sync pass immediately
      responses:
        "200":
          description: Sync finished; latest status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableStatus"
components:
  parameters:
    PortalCode:
      name: code
      in: path
      required: true
      schema: { type: string }
    SchoolId:
      name: id
      in: path
      required: true
      schema: { type: number }
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: number }
    PageId:
      name: id
      in: path
      required: true
      schema: { type: number }
    TemplateId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VideoId:
      name: id
      in: path
      required: true
      schema: { type: number }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkStatus:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    PortalIdentity:
      type: object
      properties:
        email: { type: string, minLength: 3 }
      required: [email]
    PortalSession:
      type: object
      properties:
        email: { type: string }
        isAdminContact: { type: boolean }
        school:
          $ref: "#/components/schemas/PortalSchool"
      required: [email, isAdminContact, school]
    PortalSchool:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        workshopDate: { type: ["string", "null"] }
        locked: { type: boolean }
        approxStudents: { type: ["string", "null"] }
      required: [id, name, workshopDate, locked, approxStudents]
    AnswerVersion:
      type: object
      properties:
        id: { type: number }
        value: { type: string }
        enteredBy: { type: string }
        enteredAt: { type: string }
      required: [id, value, enteredBy, enteredAt]
    QuestionAnswers:
      type: object
      properties:
        questionKey: { type: string }
        current:
          oneOf:
            - $ref: "#/components/schemas/AnswerVersion"
            - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/AnswerVersion"
      required: [questionKey, current, history]
    TeacherRow:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        studentCount: { type: number, minimum: 0 }
      required: [firstName, lastName, email, studentCount]
    TeachersSnapshot:
      type: object
      properties:
        id: { type: number }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TeacherRow"
        totalStudents: { type: number }
        enteredBy: { type: string }
        enteredAt: { type: string }
      required: [id, rows, totalStudents, enteredBy, enteredAt]
    SchoolAnswers:
      type: object
      properties:
        school:
          $ref: "#/components/schemas/PortalSchool"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionAnswers"
        teachers:
          type: object
          properties:
            current:
              oneOf:
                - $ref: "#/components/schemas/TeachersSnapshot"
                - type: "null"
            history:
              type: array
              items:
                $ref: "#/components/schemas/TeachersSnapshot"
          required: [current, history]
      required: [school, questions, teachers]
    AnswerInput:
      type: object
      properties:
        email: { type: string, minLength: 3 }
        # Blank is allowed ONLY for schedule_override ("reset to calculated");
        # the route rejects blank values for every other question key.
        value: { type: string }
        # When set, and it identifies the latest history entry for this
        # question written by the same person, that entry is updated in
        # place instead of a new one being appended. Used so one edit
        # session produces one history entry while still saving every
        # keystroke immediately.
        amendId: { type: number }
      required: [email, value]
    TeachersInput:
      type: object
      properties:
        email: { type: string, minLength: 3 }
        rows:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TeacherRow"
      required: [email, rows]
